; Shadowrocket / Surge 规则集订阅模板（INI / ACL4SSR 语法）
;
; 为什么是 INI 而不是 conf：MiSub 的自定义模板只吃 INI，它会把这份模板渲染成
; Surge 格式（[General]/[Proxy]/[Proxy Group]/[Rule]）。
; 规则集 URL 指向本流水线发布的 .list（Surge 纯文本规则列表），
; {{RULES_VERSION}} 在发布时替换成 tag。
;
; 用法：MiSub → 订阅组 → 模板 → 自定义模板，粘贴本文件内容。
;
; ⚠️ Shadowrocket 的 UA 在 MiSub 里被硬映射成 base64（只给节点列表，零规则），
;    所以客户端订阅地址必须显式带上 ?target=surge（或 ?target=surge&ver=4），
;    否则这份模板不会被应用。
;
; 注意：Surge 侧能表达 select / url-test / fallback / rule-set /
; domain-suffix / domain-keyword / MATCH 等；mihomo 专有项
; （sniffer / fake-ip-filter-mode / tun.stack / PROCESS-NAME / AND / DST-PORT）
; 无对应物，会自然缺失 —— 格式差异，不是漏洞。

[custom]
; ---- 规则集：顺序 = mihomo YAML 里 rules 的匹配顺序 ----
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/CauriumX/mihomo-apply@{{RULES_VERSION}}/list/geoip/Local-IP.list
ruleset=REJECT,https://cdn.jsdelivr.net/gh/CauriumX/mihomo-apply@{{RULES_VERSION}}/list/site/AD-Site.list
