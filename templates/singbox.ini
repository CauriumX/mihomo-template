; sing-box 规则集订阅模板（INI / ACL4SSR 语法）
;
; 为什么是 INI 而不是 JSON：MiSub 的自定义模板只吃 INI，它会把这份模板
; 渲染成 sing-box JSON（rule_set format 按 .srs 后缀自动判定为 binary）。
; 规则集 URL 指向本流水线发布的 .srs，{{RULES_VERSION}} 在发布时替换成 tag。
;
; 用法：MiSub → 订阅组 → 模板 → 自定义模板，粘贴本文件内容；
; 或者把 raw URL 填进「远程模板」并确保后缀是 .ini。
;
; 注意：INI 模型能表达 select / url-test / fallback / rule-set /
; domain-suffix / domain-keyword / MATCH。mihomo 专有项
; （sniffer / fake-ip-filter-mode / tun.stack / PROCESS-NAME / AND / DST-PORT）
; 在 sing-box 侧无对应物，会自然缺失 —— 这是格式差异，不是漏洞。

[custom]
; ---- 规则集：顺序 = mihomo YAML 里 rules 的匹配顺序 ----
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/CauriumX/mihomo-apply@{{RULES_VERSION}}/singbox/geoip/Local-IP.srs
ruleset=REJECT,https://cdn.jsdelivr.net/gh/CauriumX/mihomo-apply@{{RULES_VERSION}}/singbox/site/AD-Site.srs
ruleset=🤖AI,https://cdn.jsdelivr.net/gh/CauriumX/mihomo-apply@{{RULES_VERSION}}/singbox/site/AI-Site.srs
ruleset=📖IntlAcademic,https://cdn.jsdelivr.net/gh/CauriumX/mihomo-apply@{{RULES_VERSION}}/singbox/site/IntlAcademic-Site.srs
ruleset=💡Adobe,https://cdn.jsdelivr.net/gh/CauriumX/mihomo-apply@{{RULES_VERSION}}/singbox/site/Adobe-Site.srs
