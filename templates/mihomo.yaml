# ============================================================================
# 规则 —— 与服务商标准配置完全一致，未做任何改动
# ============================================================================

rules:
  - "RULE-SET,Local-IP,DIRECT,no-resolve"
  - "AND,((DST-PORT,443),(NETWORK,UDP)),REJECT"
  - "DST-PORT,25/587/465/143/993/110/995,DIRECT"
  - "DOMAIN,ntp.aliyun.com,DIRECT"
  - "DOMAIN-SUFFIX,lan,DIRECT"
  - "DOMAIN-SUFFIX,local,DIRECT"
  - "DOMAIN,localhost.ptlogin2.qq.com,DIRECT"
  - "DOMAIN-SUFFIX,msftconnecttest.com,🌏️Main Proxy"
  - "DOMAIN-SUFFIX,msftncsi.com,🌏️Main Proxy"
  - "DOMAIN,alt1-mtalk.google.com,🔍Google"
  - "DOMAIN,alt2-mtalk.google.com,🔍Google"
  - "DOMAIN,alt3-mtalk.google.com,🔍Google"
  - "DOMAIN,alt4-mtalk.google.com,🔍Google"
  - "DOMAIN,alt5-mtalk.google.com,🔍Google"
  - "DOMAIN,alt6-mtalk.google.com,🔍Google"
  - "DOMAIN,alt7-mtalk.google.com,🔍Google"
  - "DOMAIN,alt8-mtalk.google.com,🔍Google"
  - "DOMAIN,mtalk.google.com,🔍Google"
  - "DOMAIN,local.adguard.org,DIRECT"
  - "DOMAIN,injections.adguard.org,DIRECT"
  - "DOMAIN-SUFFIX,googleapis.com,🔍Google"
  - "DOMAIN-SUFFIX,googleapis.cn,🔍Google"
  - "PROCESS-NAME,xray.exe,DIRECT"
  - "PROCESS-NAME,sing-box.exe,DIRECT"
  - "PROCESS-NAME,DownloadSDKServer.exe,DIRECT"
  - "PROCESS-NAME,CrossDeviceResume.exe,DIRECT"
  - "PROCESS-NAME,CrossDeviceService.exe,DIRECT"
  - "PROCESS-NAME,PhoneExperienceHost.exe,DIRECT"
  - "AND,((PROCESS-NAME,baidunetdiskhost.exe),(DST-PORT,80/1000-65535)),REJECT"
  - "RULE-SET,AD-Site,REJECT"
  # >>> PAYPAL-PHISH-INLINE (auto-generated, do not edit by hand)
  # PayPal 钓鱼/仿冒域名（内联，省一次 provider 请求）
  # 判定依据：DNS MX 证据 —— 官方 MX=mx1.paypalcorp.com，
  #          钓鱼站无 MX 或 MX=bh.markmonitor.com（品牌保护商已收购停用）
  # 已校验：不含 paypal.com / paypalobjects.com / paypalinc.com 等官方域名
  # 由 filter-paypal-phish.py 生成，sync-inline-phish.py 注入
  - "DOMAIN-SUFFIX,briantreepayments.net,REJECT"
  - "DOMAIN-SUFFIX,briantreepayments.tv,REJECT"
  - "DOMAIN-SUFFIX,pa9pal.com,REJECT"
  - "DOMAIN-SUFFIX,paaypal.com,REJECT"
  - "DOMAIN-SUFFIX,paipal.com,REJECT"
  - "DOMAIN-SUFFIX,pavpal.com,REJECT"
  - "DOMAIN-SUFFIX,paypa1.com,REJECT"
  - "DOMAIN-SUFFIX,paypa1.org,REJECT"
  - "DOMAIN-SUFFIX,paypaal.com,REJECT"
  - "DOMAIN-SUFFIX,paypal-secure.net,REJECT"
  - "DOMAIN-SUFFIX,paypal-secure.org,REJECT"
  - "DOMAIN-SUFFIX,paypal-security.net,REJECT"
  - "DOMAIN-SUFFIX,paypal-security.org,REJECT"
  - "DOMAIN-SUFFIX,payppal.com,REJECT"
  - "DOMAIN-SUFFIX,payypal.com,REJECT"
  # <<< PAYPAL-PHISH-INLINE
  # ---------- 服务分流（按 provider 名称字母序） ----------
  - "RULE-SET,AI-Site,🤖AI"
  - "RULE-SET,Adobe-Site,💡Adobe"
  - "RULE-SET,Bahamut-Site,🌸Bahamut"
  - "RULE-SET,Bilibili-Site,📺Bilibili"
  # Crypto keyword —— mrs 只支持 exact/suffix，这 5 条只能内联。
  # 必须在 RULE-SET,Crypto 之前，否则域名被 mrs 的 suffix 规则先匹配走。
  - "DOMAIN-KEYWORD,binance,💰Crypto"
  - "DOMAIN-KEYWORD,binancezh,💰Crypto"
  - "DOMAIN-KEYWORD,huobi,💰Crypto"
  - "DOMAIN-KEYWORD,okx-dns,💰Crypto"
  - "DOMAIN-KEYWORD,saasexch,💰Crypto"
  - "RULE-SET,Crypto,💰Crypto"
  - "RULE-SET,Discord-Site,🎙️Discord"
  - "RULE-SET,Disney-Site,🎥Disney"
  - "RULE-SET,Meta-Site,🪢Meta"
  - "RULE-SET,Netflix-Site,🎥Netflix"
  # PayPal keyword —— 同上，9 条内联。
  # paypal / pypl / venmo / xoom 等关键词能覆盖大量变体域名，
  # 放进 mrs 会退化成 exact 匹配（只匹配字面量 "paypal"），等于失效。
  - "DOMAIN-KEYWORD,braintreepayments,💳PayPal"
  - "DOMAIN-KEYWORD,paypal,💳PayPal"
  - "DOMAIN-KEYWORD,paypal-center,💳PayPal"
  - "DOMAIN-KEYWORD,paypal-login,💳PayPal"
  - "DOMAIN-KEYWORD,paypalcommunity,💳PayPal"
  - "DOMAIN-KEYWORD,paypalhere,💳PayPal"
  - "DOMAIN-KEYWORD,pypl,💳PayPal"
  - "DOMAIN-KEYWORD,venmo,💳PayPal"
  - "DOMAIN-KEYWORD,xoom,💳PayPal"
  - "RULE-SET,PayPal,💳PayPal"
  - "RULE-SET,Pixiv-Site,🎨Pixiv"
  - "RULE-SET,Reddit-Site,💬Reddit"
  - "RULE-SET,Steam-Site,🎮Steam"
  - "RULE-SET,Telegram-Site,✈️Telegram"
  - "RULE-SET,Twitch-Site,📺Twitch"
  - "RULE-SET,Twitter-Site,💬Twitter"
  # ---------- 大厂与国内（放后，避免抢走服务分流） ----------
  - "RULE-SET,Apple-Site,🍎Apple"
  - "RULE-SET,Google-Site,🔍Google"
  - "RULE-SET,Microsoft-Site,💻Microsoft"
  - "RULE-SET,China-Site,🇨🇳China Services"
  # ---------- IP 类（放最后，避免过度解析） ----------
  - "RULE-SET,Telegram-IP,✈️Telegram,no-resolve"
  - "RULE-SET,China-IP,🇨🇳China Services"
  - "MATCH,🌏️Main Proxy"
# hook 流程验证标记
